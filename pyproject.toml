[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gradient-backend"
version = "0.1.0"
description = "Human corrections to executable RL curricula and frozen transfer evaluations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
training = ["verifiers==0.1.14", "prime-sandboxes==0.2.42"]
dev = ["ruff>=0.12", "httpx>=0.28"]

[project.scripts]
gradient = "gradient.main:main"

[tool.hatch.build.targets.wheel]
packages = ["gradient"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
